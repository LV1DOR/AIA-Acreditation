name: aia-phase3-linux-synthetic
services:
  app:
    build:
      context: ../..
      dockerfile: infra/linux-test/Dockerfile
    mem_limit: 512m
    cpus: 1
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/status').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 20
  proxy:
    image: nginx:stable-alpine
    ports: ["127.0.0.1:3210:8080"]
    mem_limit: 64m
    cpus: 0.5
    volumes: ["./nginx.conf:/etc/nginx/nginx.conf:ro"]
    depends_on:
      app:
        condition: service_healthy
  redis:
    image: redis:7-alpine
    mem_limit: 64m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
