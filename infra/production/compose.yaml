name: ${AIA_PROJECT_NAME:?Set an accreditation-specific project name}
x-logging: &logging
  driver: local
  options: {max-size: "10m", max-file: "3"}
x-app: &app
  restart: unless-stopped
  init: true
  read_only: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  logging: *logging
  networks: [backend, egress]
  environment:
    AIA_RUNTIME_ENV_FILE: /run/secrets/runtime_env
    NODE_EXTRA_CA_CERTS: /run/secrets/ca_cert
  secrets: [ca_cert]
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}
    minio: {condition: service_healthy}
services:
  web:
    <<: *app
    image: ${AIA_WEB_IMAGE:?Set an immutable candidate image}
    secrets: [ca_cert, {source: web_env, target: runtime_env}]
    tmpfs: ["/tmp:size=64m,mode=1777", "/app/apps/web/.next/cache:uid=1000,gid=1000,size=64m,mode=0700"]
    cpus: 1.5
    mem_limit: 768m
    pids_limit: 128
    healthcheck: {test: [CMD, node, /app/deployment/healthcheck.mjs], interval: 10s, timeout: 5s, retries: 6, start_period: 20s}
  worker:
    <<: *app
    image: ${AIA_WORKER_IMAGE:?Set an immutable candidate image}
    secrets: [ca_cert, {source: worker_env, target: runtime_env}]
    tmpfs: ["/tmp:size=32m,mode=1777"]
    cpus: 0.75
    mem_limit: 384m
    pids_limit: 96
    stop_grace_period: 55s
    healthcheck: {test: [CMD, node, /app/deployment/healthcheck.mjs, "http://127.0.0.1:3102"], interval: 10s, timeout: 5s, retries: 6, start_period: 20s}
  postgres:
    image: postgres:17-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
    restart: unless-stopped
    entrypoint: [sh, /etc/aia/postgres-entrypoint.sh]
    command: [postgres, -c, ssl=on, -c, ssl_cert_file=/run/secrets/postgres_cert, -c, ssl_key_file=/var/lib/postgresql/tls/server.key, -c, hba_file=/etc/aia/pg_hba.conf, -c, shared_buffers=128MB, -c, max_connections=80, -c, log_min_error_statement=panic, -c, log_statement=none, -c, log_parameter_max_length_on_error=0, -c, log_min_messages=panic]
    environment: {POSTGRES_USER: aia_cluster_admin, POSTGRES_DB: postgres, POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password, POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=trust"}
    secrets: [postgres_password, postgres_cert, postgres_key]
    volumes: ["postgres-data:/var/lib/postgresql/data", "./postgres-entrypoint.sh:/etc/aia/postgres-entrypoint.sh:ro", "./pg_hba.conf:/etc/aia/pg_hba.conf:ro"]
    networks: [backend]
    cpus: 1
    mem_limit: 512m
    shm_size: 128m
    logging: *logging
    healthcheck: {test: [CMD, pg_isready, -U, aia_cluster_admin, -d, postgres], interval: 3s, timeout: 3s, retries: 30}
  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    user: redis
    restart: unless-stopped
    command: [redis-server, /etc/redis/redis.conf]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    secrets: [ca_cert, redis_cert, redis_key, redis_acl, redis_password]
    volumes: ["redis-data:/data", "./redis.conf:/etc/redis/redis.conf:ro"]
    networks: [backend]
    cpus: 0.5
    mem_limit: 256m
    logging: *logging
    healthcheck: {test: [CMD-SHELL, 'REDISCLI_AUTH="$$(cat /run/secrets/redis_password)" redis-cli --tls --cacert /run/secrets/ca_cert --user aia -h redis ping | grep -q PONG'], interval: 3s, timeout: 3s, retries: 30}
  minio:
    # No legacy image default: supported storage must be explicitly selected/reviewed.
    image: ${AIA_MINIO_IMAGE:?Supply a reviewed digest-pinned supported MinIO image or use external-storage override}
    user: "1000:1000"
    restart: unless-stopped
    command: [server, /data, --address, ":9000", --console-address, "127.0.0.1:9001", --certs-dir, /run/minio-certs]
    environment: {MINIO_ROOT_USER_FILE: /run/secrets/minio_root_user, MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password, MINIO_BROWSER: "off", MINIO_UPDATE: "off"}
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    secrets: [minio_root_user, minio_root_password]
    volumes: ["minio-data:/data", "${AIA_TLS_DIRECTORY:?Supply private TLS directory}/minio:/run/minio-certs:ro"]
    tmpfs: ["/tmp:size=32m,mode=1777"]
    networks: [backend]
    cpus: 1
    mem_limit: 512m
    logging: *logging
    healthcheck: {test: [CMD-SHELL, 'curl --fail --silent --cacert /run/minio-certs/CAs/ca.crt https://minio:9000/minio/health/live >/dev/null'], interval: 5s, timeout: 3s, retries: 30}
    depends_on: {storage-volume-init: {condition: service_completed_successfully}}
  storage-volume-init:
    image: postgres:17-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
    restart: "no"
    entrypoint: [sh, -c]
    command: ['if [ -z "$$(ls -A /data)" ]; then chown 1000:1000 /data && chmod 0700 /data; else test "$$(stat -c %u:%g /data)" = "1000:1000"; fi']
    network_mode: none
    volumes: ["minio-data:/data"]
    read_only: true
    logging: *logging
  ingress:
    image: nginx:stable-alpine@sha256:ed84151ed2d47ef93c0939eb9b9754c6990db6092cd2081e11988a47a83d47ea
    user: "101:101"
    restart: unless-stopped
    entrypoint: [nginx]
    command: [-g, "daemon off;"]
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    ports: ["127.0.0.1:${AIA_HTTP_BIND_PORT:?Set unused loopback HTTP port}:8080", "127.0.0.1:${AIA_HTTPS_BIND_PORT:?Set unused loopback TLS port}:8443"]
    volumes: ["./nginx.conf:/etc/nginx/nginx.conf:ro"]
    secrets: [ingress_site, ingress_cert, ingress_key, proxy_auth]
    tmpfs: ["/tmp:uid=101,gid=101,size=64m,mode=0700"]
    networks: [backend, egress]
    depends_on: {web: {condition: service_healthy}}
    cpus: 0.5
    mem_limit: 128m
    logging: *logging
    healthcheck: {test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8080/health/ingress"], interval: 10s, timeout: 3s, retries: 6}
  tools:
    <<: *app
    profiles: [maintenance]
    restart: "no"
    image: ${AIA_TOOLS_IMAGE:?Set matching maintenance image}
    secrets: [ca_cert, {source: tools_env, target: runtime_env}, postgres_password, minio_root_user, minio_root_password]
    volumes: ["${AIA_BACKUP_DIRECTORY:?Set private backup directory}:/backups", "${AIA_SECRETS_DIRECTORY:?Set private secrets directory}:/run/operator-secrets:ro"]
    tmpfs: ["/tmp:uid=1000,gid=1000,size=128m,mode=0700"]
    cpus: 1
    mem_limit: 768m
    pids_limit: 128
volumes:
  postgres-data:
  redis-data:
  minio-data:
networks:
  backend: {internal: true}
  egress: {}
secrets:
  ca_cert: {file: "${AIA_TLS_DIRECTORY}/ca.crt"}
  postgres_cert: {file: "${AIA_TLS_DIRECTORY}/postgres.crt"}
  postgres_key: {file: "${AIA_TLS_DIRECTORY}/postgres.key"}
  redis_cert: {file: "${AIA_TLS_DIRECTORY}/redis.crt"}
  redis_key: {file: "${AIA_TLS_DIRECTORY}/redis.key"}
  ingress_cert: {file: "${AIA_TLS_DIRECTORY}/ingress.crt"}
  ingress_key: {file: "${AIA_TLS_DIRECTORY}/ingress.key"}
  postgres_password: {file: "${AIA_SECRETS_DIRECTORY}/postgres-password"}
  redis_password: {file: "${AIA_SECRETS_DIRECTORY}/redis-password"}
  redis_acl: {file: "${AIA_SECRETS_DIRECTORY}/redis.acl"}
  minio_root_user: {file: "${AIA_SECRETS_DIRECTORY}/minio-root-user"}
  minio_root_password: {file: "${AIA_SECRETS_DIRECTORY}/minio-root-password"}
  web_env: {file: "${AIA_SECRETS_DIRECTORY}/web.env"}
  worker_env: {file: "${AIA_SECRETS_DIRECTORY}/worker.env"}
  tools_env: {file: "${AIA_SECRETS_DIRECTORY}/tools.env"}
  ingress_site: {file: "${AIA_SECRETS_DIRECTORY}/ingress-site.conf"}
  proxy_auth: {file: "${AIA_SECRETS_DIRECTORY}/proxy-auth.conf"}
