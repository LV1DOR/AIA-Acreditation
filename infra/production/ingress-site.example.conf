# Replace the domain/authority and certificate with the reviewed deployment inputs.
# If behind a trusted edge, add set_real_ip_from for its exact address/CIDRs only,
# and real_ip_header X-Real-IP. The edge MUST overwrite this header with remote_addr.
server {
    listen 8080;
    server_name accreditation.example.invalid;
    location = /health/ingress { access_log off; return 200 "alive\n"; }
    location / { return 308 https://accreditation.example.invalid$request_uri; }
}
server {
    listen 8443 ssl;
    server_name accreditation.example.invalid;
    if ($http_host != "accreditation.example.invalid") { return 444; }
    ssl_certificate /run/secrets/ingress_cert;
    ssl_certificate_key /run/secrets/ingress_key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    include /run/secrets/proxy_auth;
    location ~ ^/(?:_next/(?:webpack-hmr|dev)|__nextjs|__nextjs_.*|\.env|\.git) { return 404; }
    location / {
        limit_req zone=aia_mutations burst=30 nodelay;
        limit_req zone=aia_mutations_global burst=30 nodelay;
        limit_req zone=aia_public burst=60 nodelay;
        limit_conn aia_connections 20;
        limit_conn aia_total_connections 100;
        proxy_request_buffering on;
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 75s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Forwarded "";
        proxy_set_header X-AIA-Client-IP $remote_addr;
        proxy_set_header X-AIA-Proxy-Secret $aia_proxy_secret;
        proxy_pass http://aia_web;
    }
}
