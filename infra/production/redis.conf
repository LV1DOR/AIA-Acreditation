bind 0.0.0.0
port 0
tls-port 6379
tls-cert-file /run/secrets/redis_cert
tls-key-file /run/secrets/redis_key
tls-ca-cert-file /run/secrets/ca_cert
tls-auth-clients no
aclfile /run/secrets/redis_acl
dir /data
appendonly yes
appendfsync everysec
maxmemory 192mb
maxmemory-policy noeviction
loglevel warning
