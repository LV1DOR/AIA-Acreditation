worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr crit;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    # Never log URI, query, cookie, address, referer or authentication fields.
    log_format aia_safe '$request_method $status $body_bytes_sent $request_time';
    access_log /dev/stdout aia_safe;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 9m;
    client_body_buffer_size 128k;
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 30s;
    map $request_method $aia_mutation_ip { default ""; POST $binary_remote_addr; }
    map $request_method $aia_mutation_global { default ""; POST "aia-accreditation"; }
    map $uri $aia_public_ip { default ""; ~^/(pt|en)/onboarding/ $binary_remote_addr; /api/invitations/start $binary_remote_addr; }
    limit_req_zone $aia_mutation_ip zone=aia_mutations:2m rate=120r/m;
    limit_req_zone $aia_mutation_global zone=aia_mutations_global:1m rate=600r/m;
    limit_req_zone $aia_public_ip zone=aia_public:2m rate=120r/m;
    limit_conn_zone $binary_remote_addr zone=aia_connections:1m;
    limit_conn_zone $server_name zone=aia_total_connections:1m;
    limit_req_status 429;
    limit_conn_status 429;
    resolver 127.0.0.11 valid=5s ipv6=off;
    upstream aia_web { zone aia_web 32k; server web:3100 resolve; }
    include /run/secrets/ingress_site;
}
