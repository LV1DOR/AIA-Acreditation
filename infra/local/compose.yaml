name: aia-acreditacao-local
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: acreditacao_local
      POSTGRES_PASSWORD: local_only_password
      POSTGRES_DB: aia_acreditacao_local
    ports: ["127.0.0.1:16432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acreditacao_local -d aia_acreditacao_local"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:16379:6379"]
    volumes: ["redis-data:/data"]
  mailpit:
    image: axllent/mailpit:v1.29
    ports: ["127.0.0.1:11025:1025", "127.0.0.1:18025:8025"]
  minio:
    image: quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: acreditacao_minio
      MINIO_ROOT_PASSWORD: local_minio_password_only
    ports: ["127.0.0.1:19000:9000", "127.0.0.1:19001:9001"]
    volumes: ["minio-data:/data"]
  clamav:
    image: clamav/clamav:1.4
    profiles: ["malware-scan"]
    ports: ["127.0.0.1:13310:3310"]
    volumes: ["clamav-data:/var/lib/clamav"]
volumes:
  postgres-data:
  redis-data:
  minio-data:
  clamav-data:
