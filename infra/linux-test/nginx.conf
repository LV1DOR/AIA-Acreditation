events { worker_connections 64; }
http {
 log_format no_pii '$request_method $status $request_time';
 access_log /dev/stdout no_pii;
 limit_req_zone $binary_remote_addr zone=synthetic_requests:1m rate=120r/m;
 server {
  listen 8080;
  client_max_body_size 9m;
  client_body_buffer_size 128k;
  client_body_timeout 15s;
  limit_req_status 429;
  location / {
   limit_req zone=synthetic_requests burst=30 nodelay;
   proxy_request_buffering on;
   proxy_set_header Host $host;
   proxy_set_header X-AIA-Client-IP $remote_addr;
   proxy_set_header X-AIA-Proxy-Secret "SYNTHETIC-LOCAL-INGRESS-TEST-ONLY-00000000";
   proxy_set_header X-Forwarded-For "";
   proxy_pass http://app:3000;
  }
 }
}
